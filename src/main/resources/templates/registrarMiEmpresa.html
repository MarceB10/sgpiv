<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Empresa</title>

    <link rel="stylesheet" th:href="@{/css/registrarMiEmpresa.css}">

    <!-- ICONOS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="main-content">

    <!-- HEADER -->
    <div class="page-header">
        <h1>Registrar mi empresa</h1>
        <p>Panel de usuario — Parque Industrial Viedma</p>
    </div>

    <!-- ALERTA -->
    <div class="info-box">
        <div class="info-icon">
            <i class="fa-solid fa-circle-info"></i>
        </div>

        <div class="info-text">
            <h3>Información importante</h3>
            <p>
                Completá los datos de tu empresa para registrarla en el sistema.
                Esta información será revisada por el Gerente del Parque Industrial.
            </p>
        </div>
    </div>

    <!-- FORMULARIO -->
    <div class="form-card">

        <h2>Datos de la empresa</h2>

        <form>

            <div class="form-grid">

                <div class="form-group">
                    <label>Nombre de fantasía *</label>
                    <input type="text" placeholder="Ej: Mi Empresa SRL">
                </div>

                <div class="form-group">
                    <label>Razón social *</label>
                    <input type="text"
                           placeholder="Ej: Mi Empresa Sociedad de Responsabilidad Limitada">
                </div>

                <div class="form-group">
                    <label>CUIT *</label>
                    <input type="text" placeholder="Ej: 30-12345678-9">
                </div>

                <div class="form-group">
                    <label>Ingresos brutos *</label>
                    <input type="text" placeholder="Ej: 901-123456-7">
                </div>

                <div class="form-group">
                    <label>Rubro / Actividad principal *</label>

                    <select>
                        <option>Seleccioná el rubro</option>
                        <option>Tecnología</option>
                        <option>Alimentos</option>
                        <option>Metalúrgica</option>
                        <option>Logística</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Tipo de industria *</label>

                    <select>
                        <option>Seleccioná el tipo de industria</option>
                        <option>Industrial</option>
                        <option>Comercial</option>
                        <option>Servicios</option>
                    </select>
                </div>

            </div>

            <!-- DESCRIPCION -->
            <div class="form-group full-width">
                <label>Descripción de bienes / servicios *</label>

                <textarea
                        placeholder="Contá brevemente qué bienes producís o qué servicios ofrecés..."></textarea>
            </div>

            <!-- CONTACTO -->
            <div class="contact-grid">

                <div class="form-group">
                    <label>Email de contacto *</label>

                    <div class="input-icon">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email"
                               placeholder="Ej: contacto@miempresa.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Teléfono de contacto</label>

                    <div class="input-icon">
                        <i class="fa-solid fa-phone"></i>
                        <input type="text"
                               placeholder="Ej: 2920 12-3456">
                    </div>
                </div>

            </div>

            <!-- DIRECCION -->
            <div class="form-group full-width">
                <label>Dirección del local / planta *</label>

                <div class="input-icon">
                    <i class="fa-solid fa-location-dot"></i>

                    <input type="text"
                           placeholder="Ej: Calle 123 N° 456, Viedma, Río Negro">
                </div>
            </div>

            <!-- BOTONES -->
            <div class="buttons">

                <button class="btn-primary" type="submit">
                    <i class="fa-regular fa-floppy-disk"></i>
                    Guardar y enviar
                </button>

                <button class="btn-secondary" type="button">
                    Cancelar
                </button>

            </div>

            <p class="footer-text">
                Los campos marcados con * son obligatorios
            </p>

        </form>

    </div>

</div>

</body>
</html>

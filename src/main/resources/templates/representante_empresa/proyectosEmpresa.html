<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mis Proyectos</title>
    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/proyectosEmpresa.css}">
</head>

<body>
<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="main-content">
    <div class="header">
        <h1>Mis Proyectos</h1>
        <p>Proyectos asociados a tu empresa</p>
    </div>

    <div class="projects-container">
        <div class="project-card"
             th:each="proyecto : ${proyectos}"
             th:with="porcentaje=${proyecto.progreso == null ? 0 : (proyecto.progreso <= 1 ? proyecto.progreso * 100 : proyecto.progreso)}">

            <h2 th:text="${proyecto.titulo}"></h2>

            <p th:text="${proyecto.descripcion}"></p>

            <div class="project-info">
        <span>
            Rubro: <b th:text="${proyecto.rubro}"></b>
        </span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"
                     th:style="'width:' + ${porcentaje} + '%'">
                </div>
            </div>

            <p class="progress-text">
                <span th:text="${#numbers.formatDecimal(porcentaje, 0, 0)}"></span>%
                completado
            </p>

            <a class="view-btn"
               th:href="@{/empresas/proyecto/{id}(id=${proyecto.id})}">
                Ver proyecto
            </a>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Proyecto</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/proyectoEmpresa.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="content">

    <section class="dashboard">

        <!-- HEADER -->
        <header class="project-header">

            <a th:href="@{/empresas/proyectos}"
               class="btn-volver">
                <i class="fa-solid fa-arrow-left"></i>
                Volver a proyectos
            </a>

            <div class="title-row">

                <div>
                    <h1 th:text="${proyecto.titulo}"></h1>
                </div>

                <div class="title-icon">
                    <i class="fa-solid fa-industry"></i>
                </div>

            </div>

        </header>

        <!-- TARJETAS -->
        <section class="cards"
                 th:with="progreso=${#numbers.formatDecimal(proyecto.obtenerProgreso(),0,0)}">

            <!-- ESTADO -->
            <article class="summary-card">

                <div class="card-icon success">
                    <i class="fa-solid fa-circle-check"></i>
                </div>

                <div class="card-info">
                    <span>Estado</span>

                    <strong class="estado-text"
                            th:text="${proyecto.estadoProyecto}">
                    </strong>
                </div>

            </article>

            <!-- INICIO -->
            <article class="summary-card">

                <div class="card-icon blue">
                    <i class="fa-regular fa-calendar"></i>
                </div>

                <div class="card-info">
                    <span>Inicio</span>

                    <strong th:text="${proyecto.fechaInicio}">
                    </strong>

                    <small class="pill neutral-pill">
                        Fecha de inicio
                    </small>
                </div>

            </article>

            <!-- PERSONAL -->
            <article class="summary-card">

                <div class="card-icon blue">
                    <i class="fa-solid fa-users"></i>
                </div>

                <div class="card-info">
                    <span>Personal</span>

                    <strong th:text="${proyecto.personalAOcupar}">
                    </strong>

                    <small class="pill neutral-pill">
                        Personas asignadas
                    </small>
                </div>

            </article>

            <!-- PROGRESO -->
            <article class="summary-card progress-card"
                     th:style="'--progress:' + ${progreso} + '%'">

                <div class="progress-ring">
                    <div class="progress-inner">
                        <span th:text="${progreso + '%'}"></span>
                    </div>
                </div>

                <div class="card-info">
                    <span>Progreso</span>

                    <strong th:text="${progreso + '%'}">
                    </strong>

                    <div class="progress-line">
                        <div class="progress-fill"></div>
                    </div>

                    <small class="progress-label">
                        Avance del proyecto
                    </small>
                </div>

            </article>

        </section>

        <!-- TAREAS -->
        <section class="tasks-panel">

            <div class="tasks-header">

                <div class="section-icon">
                    <i class="fa-regular fa-clipboard"></i>
                </div>

                <h2>Tareas asignadas</h2>

            </div>

            <!-- SI HAY TAREAS -->
            <div th:if="${proyecto.tareas != null and !proyecto.tareas.isEmpty()}">

                <article class="task-item"
                         th:each="tarea : ${proyecto.tareas}"
                         th:classappend="${tarea.completa} ? ' task-completed' : ' task-pending'">

                    <div class="task-left">

                        <div class="task-icon"
                             th:classappend="${tarea.completa} ? ' completed-icon' : ' pending-icon'">

                            <i th:if="${tarea.completa}"
                               class="fa-solid fa-check"></i>

                            <i th:if="${!tarea.completa}"
                               class="fa-regular fa-clock"></i>

                        </div>

<!--                        <div class="task-check-indicator"-->
<!--                             th:classappend="${tarea.completa} ? ' completed' : ' pending'">-->

<!--                            <i th:if="${tarea.completa}"-->
<!--                               class="fa-solid fa-check"></i>-->

<!--                        </div>-->

                        <div class="task-info">

                            <h4 th:text="${tarea.titulo}"></h4>

                            <p th:text="${tarea.descripcion}"></p>

                        </div>

                    </div>

                    <div class="task-actions">

                        <span class="task-status"
                              th:classappend="${tarea.completa} ? ' status-completed' : ' status-pending'">

                            <i th:if="${tarea.completa}"
                               class="fa-regular fa-circle-check"></i>

                            <i th:if="${!tarea.completa}"
                               class="fa-regular fa-clock"></i>

                            <span th:text="${tarea.completa} ? 'Completada' : 'Pendiente'"></span>

                        </span>

                        <form th:action="@{/tareas/{id}/toggle(id=${tarea.id})}"
                              method="post">

                            <button type="submit"
                                    class="check-btn"
                                    th:title="${tarea.completa} ? 'Marcar como pendiente' : 'Marcar como completada'">

                                <i th:if="${tarea.completa}"
                                   class="fa-solid fa-circle-check"></i>

                                <i th:if="${!tarea.completa}"
                                   class="fa-regular fa-circle"></i>

                            </button>

                        </form>

                    </div>

                </article>

            </div>

            <!-- SI NO HAY TAREAS -->
            <div class="sin-tareas"
                 th:if="${proyecto.tareas == null or proyecto.tareas.isEmpty()}">

                <div class="empty-icon">
                    <i class="fa-regular fa-clipboard"></i>
                </div>

                <h3>No hay tareas asignadas</h3>

                <p>
                    Este proyecto aún no tiene tareas asignadas.
                </p>

            </div>

        </section>

    </section>

</main>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const scrollGuardado = sessionStorage.getItem("scrollProyectoEmpresa");

        if (scrollGuardado !== null) {
            window.scrollTo(0, parseInt(scrollGuardado));
            sessionStorage.removeItem("scrollProyectoEmpresa");
        }

        const formulariosTareas = document.querySelectorAll(".task-actions form");

        formulariosTareas.forEach(formulario => {
            formulario.addEventListener("submit", function () {
                sessionStorage.setItem("scrollProyectoEmpresa", window.scrollY);
            });
        });
    });
</script>
</body>
</html>

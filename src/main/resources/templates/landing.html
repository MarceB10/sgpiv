<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Bienvenido - SGPIV</title>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        height: 100vh;
        overflow: hidden;
        font-family: 'Raleway', sans-serif;
    }

    video {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
    }

    .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 0;
    }

    .badge-grupo {
        position: fixed;
        top: 20px;
        right: 24px;
        color: rgba(255,255,255,0.7);
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        z-index: 2;
    }

    .content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: white;
        text-align: center;
    }

    h1 {
        font-size: 3rem;
        margin-bottom: 10px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    p {
        font-size: 1.2rem;
        margin-bottom: 40px;
        font-weight: 400;
    }

    .btn-ingresar {
        padding: 14px 40px;
        font-size: 1rem;
        font-weight: 700;
        font-family: 'Raleway', sans-serif;
        letter-spacing: 1px;
        background: white;
        color: black;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: 0.2s;
        text-transform: uppercase;
    }

    .btn-ingresar:hover {
        background: #e0e0e0;
    }
  </style>
</head>
<body>

<video autoplay muted loop>
  <source th:src="@{/videocomprimido.mp4}" type="video/mp4">
</video>

<div class="overlay"></div>

<span class="badge-grupo">ViedmaTech</span>

<div class="content">
  <h1>Bienvenido a SGPIV</h1>
  <p>Sistema de Gestión del Parque Industrial de Viedma</p>
  <a href="/login" class="btn-ingresar">Ingresar</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Solicitudes - SGPIV</title>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/gerente.css}">
    <link rel="stylesheet" th:href="@{/css/solicitudesGerente.css}">

    <!-- Aca vinculé el diseño de los botones -->
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
</head>

<body>
<div class="layout">

    <!-- SIDEBAR -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <!-- CONTENIDO -->
    <main class="main-content">

        <h1>Solicitudes recibidas</h1>

        <table>

            <thead>
            <tr>
                <th>ID</th>
                <th>Empresa</th>
                <th>CUIT</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Fecha</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="solicitud : ${solicitudes}">

                <td th:text="${solicitud.id}"></td>

                <td th:text="${solicitud.razonSocial}"></td>

                <td th:text="${solicitud.cuitEmpresa}"></td>

                <td th:text="${solicitud.tipoEmpresa}"></td>

                <td th:text="${solicitud.estado}"></td>

                <td th:text="${solicitud.fechaEnvio}"></td>

                <td class="acciones">

                    <a class="btn btn-detalle"
                       th:href="@{/solicitudesGerente/{id}(id=${solicitud.id})}">
                        Ver detalle
                    </a>

                    <form th:action="@{/solicitudesGerente/{id}/aprobar(id=${solicitud.id})}"
                          method="post">

                        <button type="submit"
                                class="btn btn-aprobar">
                            Aprobar
                        </button>

                    </form>

                    <form th:action="@{/solicitudesGerente/{id}/rechazar(id=${solicitud.id})}"
                          method="post">

                        <input type="text"
                               name="motivo"
                               placeholder="Motivo rechazo">

                        <button type="submit"
                                class="btn btn-rechazar">
                            Rechazar
                        </button>

                    </form>

                </td>

            </tr>

            </tbody>

        </table>

    </main>

</div>

</body>
</html>

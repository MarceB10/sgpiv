<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Parque Industrial Viedma</title>

    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>

<div class="container">

    <!-- PANEL IZQUIERDO -->
    <div class="left-panel">

        <div class="overlay"></div>

        <div class="left-content">

            <h1>Parque Industrial VIEDMA</h1>

            <p>
                A professional kit that comes with ready-to-use
                MUI components developed with one common goal in mind,
                help you build faster & beautiful applications.
            </p>

            <div class="companies">

                <span>SAMSUNG</span>
                <span>VISA</span>
                <span>Bolt</span>
                <span>AWS</span>
                <span>accenture</span>
                <span>AT&T</span>

            </div>

        </div>

    </div>

    <!-- PANEL DERECHO -->
    <div class="right-panel">

        <div class="login-box">

            <a th:href="@{/}" class="back-link">← Login</a>

            <h2>Registrer</h2>

            <form th:action="@{/registro}" method="post">

                <div class="fila-inputs">
                    <div class="input-group">
                        <input
                                type="name"
                                name="name"
                                placeholder="Name"
                                required>
                    </div>
                    <div class="input-group">
                        <input
                                type="last-name"
                                name="last-name"
                                placeholder="Last-name"
                                required>
                    </div>
                </div>

                <div class="input-group">
                    <input
                            type="cuit"
                            name="cuit"
                            placeholder="CUIT"
                            required>
                </div>
                <!-- Barra Email Adress -->
                <div class="input-group">
                    <input
                            type="email"
                            name="username"
                            placeholder="Email Address"
                            required>
                </div>
                <div class="input-group">
                    <input
                            type="password"
                            name="password"
                            placeholder="New password"
                            required>
                </div>
                <div class="input-group">
                    <input
                            type="phone number"
                            name="phone number"
                            placeholder="Phone number (+54)"
                            required>
                </div>
                <button type="submit" class="login-btn">
                    Continue
                </button>

            </form>
        </div>

    </div>

</div>

</body>
</html>

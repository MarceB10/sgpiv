<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Parque Industrial Viedma</title>
    <link rel="stylesheet" th:href="@{/css/registro.css}">
</head>
<body>

<div class="container">

    <!-- PANEL IZQUIERDO -->
    <div class="left-panel">
        <div class="overlay"></div>
        <div class="left-content">
            <h1>Parque Industrial VIEDMA</h1>
            <p>
                A professional kit that comes with ready-to-use
                MUI components developed with one common goal in mind,
                help you build faster & beautiful applications.
            </p>
            <div class="companies">
                <span>SAMSUNG</span>
                <span>VISA</span>
                <span>Bolt</span>
                <span>AWS</span>
                <span>accenture</span>
                <span>AT&T</span>
            </div>
        </div>
    </div>

    <!-- PANEL DERECHO -->
    <div class="right-panel">
        <div class="login-box">

            <a th:href="@{/}" class="back-link">← Login</a>

            <h2>Registrarse</h2>

            <!-- error del service — CUIT o email ya registrado -->
            <p th:if="${error}" th:text="${error}" class="error-message"></p>

            <form th:action="@{/registro}" th:object="${usuarioRequestDTO}" method="post">

                <div class="fila-inputs">
                    <div class="input-group">
                        <input type="text" th:field="*{nombre}" placeholder="Nombre">
                        <p th:if="${#fields.hasErrors('nombre')}"
                           th:errors="*{nombre}"
                           class="error-message"></p>
                    </div>
                    <div class="input-group">
                        <input type="text" th:field="*{apellido}" placeholder="Apellido">
                        <p th:if="${#fields.hasErrors('apellido')}"
                           th:errors="*{apellido}"
                           class="error-message"></p>
                    </div>
                </div>

                <div class="input-group">
                    <input type="text" th:field="*{cuit}" placeholder="CUIT (sin guiones)">
                    <p th:if="${#fields.hasErrors('cuit')}"
                       th:errors="*{cuit}"
                       class="error-message"></p>
                </div>

                <div class="input-group">
                    <input type="email" th:field="*{email}" placeholder="Email Address">
                    <p th:if="${#fields.hasErrors('email')}"
                       th:errors="*{email}"
                       class="error-message"></p>
                </div>

                <div class="input-group">
                    <input type="password" th:field="*{contrasenia}" placeholder="Contraseña">
                    <p th:if="${#fields.hasErrors('contrasenia')}"
                       th:errors="*{contrasenia}"
                       class="error-message"></p>
                </div>

                <div class="input-group">
                    <input type="number" th:field="*{telefono}" placeholder="Teléfono (+54)">
                    <p th:if="${#fields.hasErrors('telefono')}"
                       th:errors="*{telefono}"
                       class="error-message"></p>
                </div>

                <button type="submit" class="login-btn">Registrarse</button>

            </form>

        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar">
    <!-- Iconos del sidebar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <div class="sidebar">

        <h2>SGPIV</h2>

        <!-- PANEL USUARIO -->
        <div class="user-panel">
            <div class="user-avatar"
                 th:text="${#strings.substring(usuario.nombre,0,1) + #strings.substring(usuario.apellido,0,1)}">
            </div>
            <div class="user-info">
                <h4 th:text="${usuario.nombre + ' ' + usuario.apellido}"></h4>

                <div th:switch="${usuario.roles[0].nombre.name()}">
                    <p th:case="'ROL_GERENTE'">Gerente</p>
                    <p th:case="'ROL_REPRESENTANTE_EMPRESA'">Representante</p>
                    <p th:case="'ROL_PROVEEDOR'">Proveedor</p>
                    <p th:case="'ROL_ORGANISMO_PUBLICO'">Organismo Público</p>
                    <p th:case="ROL_NULO">Usuario Nuevo</p>
                    <p th:case="*" th:text="${usuario.roles[0].nombre}"></p>
                </div>
            </div>
        </div>
        <!-- tus links -->
        <div class="menu-links">
            <!-- DASHBOARD — todos los roles -->
            <a th:href="@{/home}"
               th:classappend="${pagina == 'home'} ? ' active' : ''">
                <i class="fa-solid fa-chart-pie"></i> Inicio
            </a>

            <!-- ROL_GERENTE -->
            <th:block th:if="${usuario.roles[0].nombre.name() == 'ROL_GERENTE'}">
                <a th:href="@{/empresas}"
                   th:classappend="${pagina == 'empresas'} ? ' active' : ''">
                    <i class="fa-solid fa-building"></i> Empresas
                </a>
                <a th:href="@{/gerente/usuarios}"
                   th:classappend="${pagina == 'usuarios'} ? ' active' : ''">
                    <i class="fa-solid fa-users"></i> Usuarios
                </a>
                <a th:href="@{/gerente/lotes}"
                   th:classappend="${pagina == 'lotes'} ? ' active' : ''">
                    <i class="fa-solid fa-map-location-dot"></i> Lotes
                </a>
                <!-- Corregido: removimos el div repetido y agregamos el active check -->
                <a th:href="@{/solicitudesGerente}"
                   th:classappend="${pagina == 'solicitudes-gerente'} ? ' active' : ''">
                    <i class="fa-regular fa-file-lines"></i> Solicitudes recibidas
                </a>
            </th:block>

            <!-- ROL_REPRESENTANTE_EMPRESA -->
            <th:block th:if="${usuario.roles[0].nombre.name() == 'ROL_REPRESENTANTE_EMPRESA'}">
                <a th:href="@{/empresas/mi-empresa}"
                   th:classappend="${pagina == 'mi-empresa'} ? ' active' : ''">
                    <i class="fa-solid fa-industry"></i> Mi Empresa
                </a>
                <a th:href="@{/solicitudRadicacion}"
                   th:classappend="${pagina == 'solicitud-radicacion'} ? ' active' : ''">
                    <i class="fa-solid fa-file-signature"></i> Solicitud de Radicación
                </a>
            </th:block>

            <!-- ROL_PROVEEDOR -->
            <th:block th:if="${usuario.roles[0].nombre.name() == 'ROL_PROVEEDOR'}">
                <a th:href="@{/mi-perfil}"
                   th:classappend="${pagina == 'mi-perfil'} ? ' active' : ''">
                    <i class="fa-solid fa-user"></i> Mi Perfil
                </a>
            </th:block>

            <!-- ROL_ORGANISMO_PUBLICO -->
            <th:block th:if="${usuario.roles[0].nombre.name() == 'ROL_ORGANISMO_PUBLICO'}">
                <a th:href="@{/mi-perfil}"
                   th:classappend="${pagina == 'mi-perfil'} ? ' active' : ''">
                    <i class="fa-solid fa-building-shield"></i> Mi Perfil
                </a>
            </th:block>

            <!-- ROL_NULO -->
            <th:block th:if="${usuario.roles[0].nombre.name() == 'ROL_NULO'}">

                <!-- SIN SOLICITUD -->
                <a th:if="${solicitudActiva == null}"
                   th:href="@{/solicitudRadicacion}"
                   th:classappend="${pagina == 'solicitud-radicacion'} ? ' active' : ''">

                    <i class="fa-solid fa-file-signature"></i>
                    Solicitud de Radicación

                </a>

                <!-- SOLICITUD NORMAL -->
                <a th:if="${solicitudActiva != null
            and solicitudActiva.estado.name() != 'REQUIERE_MODIFICACION'}"
                   th:href="@{/miSolicitud}"
                   th:classappend="${pagina == 'mi-solicitud'} ? ' active' : ''">

                    <i class="fa-solid fa-clock"></i>
                    Ver mi solicitud

                </a>

                <!-- REQUIERE MODIFICACION -->
                <a th:if="${solicitudActiva != null
            and solicitudActiva.estado.name() == 'REQUIERE_MODIFICACION'}"
                   th:href="@{/solicitudRadicacion}"
                   th:classappend="${pagina == 'solicitud-radicacion'} ? ' active' : ''">

                    <i class="fa-solid fa-pen-to-square"></i>
                    Modificar solicitud

                </a>

            </th:block>
        </div>

        <!-- Boton cerrar sesion -->
        <div class="logout-container">
            <a th:href="@{/cerrarSesion}" class="logout-link">
                <i class="fa fa-sign-out"> </i>
                Cerrar Sesión

            </a>
        </div>
    </div>

</div>

</body>
</html>

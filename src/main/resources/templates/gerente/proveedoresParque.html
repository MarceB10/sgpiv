<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedores del Parque - SGPIV</title>
    <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
    <link rel="stylesheet" th:href="@{/css/global.css}"/>
    <link rel="stylesheet" th:href="@{/css/proveedores.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">

    <div class="header">
        <div>
            <h1>Proveedores del Parque</h1>
            <p>Gestioná los proveedores de servicios del Parque Industrial.</p>
        </div>
    </div>

    <div class="cards">

        <div class="card stat-card">

            <div class="stat-icon">
                <i class="fa-solid fa-truck"></i>
            </div>

            <h3>Total proveedores</h3>

            <h2 th:text="${proveedores.size()}"></h2>

        </div>

        <div class="card stat-card">

            <div class="stat-icon">
                <i class="fa-solid fa-share-nodes"></i>
            </div>

            <h3>Compartidos</h3>

            <h2 th:text="${proveedores.?[compartido].size()}"></h2>

        </div>

    </div>

    <!-- FORMULARIO AGREGAR -->

    <div class="form-card">
        <div class="section-title">
            <i class="fa-solid fa-plus"></i>
            <h2>Agregar proveedor</h2>
        </div>

        <form th:action="@{/gerente/proveedores}"
              th:object="${proveedorDTO}"
              method="post">

            <div class="form-grid">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" th:field="*{nombre}"
                           placeholder="Ej: Aguas Rionegrinas">
                    <p th:if="${#fields.hasErrors('nombre')}"
                       th:errors="*{nombre}" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label>Tipo de servicio *</label>
                    <select th:field="*{tipoServicio}">
                        <option value="">Seleccioná una opción</option>
                        <option value="AGUA">Agua</option>
                        <option value="LUZ">Luz</option>
                        <option value="GAS">Gas</option>
                        <option value="OTRO">Otro</option>
                    </select>
                    <p th:if="${#fields.hasErrors('tipoServicio')}"
                       th:errors="*{tipoServicio}" class="error-message"></p>
                </div>

                <div class="form-group">
                    <label>Contacto</label>
                    <input type="text" th:field="*{contacto}"
                           placeholder="Ej: 2920123456">
                </div>

                <div class="form-group">
                    <label>¿Recurso compartido?</label>
                    <select th:field="*{compartido}">
                        <option value="false">No</option>
                        <option value="true">Sí</option>
                    </select>
                </div>
            </div>

            <div class="buttons">
                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Agregar
                </button>
            </div>
        </form>
    </div>

    <!-- TABLA -->

    <div class="table-container">
        <div class="section-title">
            <i class="fa-solid fa-table"></i>
            <h2>Listado de proveedores</h2>
        </div>

        <div th:if="${proveedores.isEmpty()}" class="sin-datos">
            No hay proveedores registrados todavía.
        </div>

        <table th:if="${!proveedores.isEmpty()}">
            <thead>
            <tr>
                <th>Nombre</th>
                <th>Tipo de servicio</th>
                <th>Contacto</th>
                <th>Compartido</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="proveedor : ${proveedores}">
                <td th:text="${proveedor.nombre}"></td>
                <td th:text="${proveedor.tipoServicio}"></td>
                <td th:text="${proveedor.contacto != null ? proveedor.contacto : '-'}"></td>
                <td th:text="${proveedor.compartido ? 'Sí' : 'No'}"></td>
                <td>
                    <form th:action="@{/gerente/proveedores/{id}/eliminar(id=${proveedor.id})}"
                          method="post">
                        <button type="submit" class="btn-rechazar">
                            <i class="fa-solid fa-trash"></i> Eliminar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>

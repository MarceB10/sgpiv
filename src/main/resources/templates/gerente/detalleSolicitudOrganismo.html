<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Detalle Solicitud Organismo</title>
  <link rel="stylesheet" th:href="@{/css/sidebar.css}"/>
  <link rel="stylesheet" th:href="@{/css/detalleSolicitud.css}"/>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="main-content">

  <div class="header">
    <div class="header-text">
      <h1>Detalle de Solicitud</h1>
      <p>Revisá los datos antes de tomar una decisión</p>
    </div>
    <button onclick="window.history.back()" class="btn-volver">← Volver</button>
  </div>

  <!-- DATOS DEL SOLICITANTE -->
  <div class="seccion">
    <h2 class="seccion-titulo">👤 Datos del solicitante</h2>
    <div class="datos-grid">
      <div class="dato-item">
        <span class="dato-label">Nombre</span>
        <span class="dato-valor"
              th:text="${solicitud.nombreUsuario + ' ' + solicitud.apellidoUsuario}">-</span>
      </div>
      <div class="dato-item">
        <span class="dato-label">CUIT</span>
        <span class="dato-valor" th:text="${solicitud.cuitUsuario}">-</span>
      </div>
      <div class="dato-item">
        <span class="dato-label">Email</span>
        <span class="dato-valor" th:text="${solicitud.emailUsuario}">-</span>
      </div>
      <div class="dato-item">
        <span class="dato-label">Cargo</span>
        <span class="dato-valor" th:text="${solicitud.cargoSolicitante}">-</span>
      </div>
    </div>
  </div>

  <!-- DATOS DEL ORGANISMO -->
  <div class="seccion">
    <h2 class="seccion-titulo">🏛️ Datos del organismo</h2>
    <div class="datos-grid">
      <div class="dato-item">
        <span class="dato-label">Nombre</span>
        <span class="dato-valor" th:text="${solicitud.nombreOrganismo}">-</span>
      </div>
      <div class="dato-item">
        <span class="dato-label">Tipo</span>
        <span class="dato-valor" th:text="${solicitud.tipoOrganismo}">-</span>
      </div>

      <div class="dato-item full-width">
        <span class="dato-label">Motivo de acceso</span>
        <span class="dato-valor" th:text="${solicitud.motivoAcceso}">-</span>
      </div>

      <div class="seccion" th:if="${solicitud.nombreArchivo != null}">
        <h2 class="seccion-titulo">📄 Informe adjunto</h2>

        <!-- Preview para PDF o TXT -->
        <div class="pdf-preview-container"
             th:if="${solicitud.tipoArchivo == 'application/pdf' or solicitud.tipoArchivo == 'text/plain'}">
          <iframe th:src="@{/gerente/solicitudesOrganismo/{id}/archivo(id=${solicitud.id})}"
                  width="100%"
                  height="600px"
                  style="border: 1px solid #e2e8f0; border-radius: 10px; background: white;">
          </iframe>
        </div>

        <!-- Si no es previsualizable -->
        <div th:unless="${solicitud.tipoArchivo == 'application/pdf' or solicitud.tipoArchivo == 'text/plain'}">
          <p>No se puede previsualizar este tipo de archivo (<span th:text="${solicitud.tipoArchivo}"></span>).</p>
        </div>

        <a th:href="@{/gerente/solicitudesOrganismo/{id}/archivo(id=${solicitud.id}, modo='download')}"
           class="btn btn-edit" style="margin-top: 1rem;">
          <i class="fa-solid fa-download"></i>
          Descargar <span th:text="${solicitud.nombreArchivo}"></span>
        </a>
      </div>

    </div>
  </div>

  <!-- ACCIONES -->
  <div class="acciones">

    <button onclick="window.history.back()" class="btn-cerrar">
      Cerrar
    </button>

    <!-- RECHAZAR -->
    <div class="accion-grupo">
      <h3 class="accion-titulo">
        <i class="fa-solid fa-xmark"></i> Rechazar solicitud
      </h3>
      <form th:action="@{/gerente/solicitudesOrganismo/{id}/rechazar(id=${solicitud.id})}"
            method="post">
                <textarea name="motivo"
                          placeholder="Motivo de rechazo (obligatorio)"
                          class="input-motivo"
                          required></textarea>
        <button type="submit" class="btn-rechazar">
          <i class="fa-solid fa-xmark"></i> Rechazar
        </button>
      </form>
    </div>

    <!-- APROBAR -->
    <form th:action="@{/gerente/solicitudesOrganismo/{id}/aprobar(id=${solicitud.id})}"
          method="post">
      <button type="submit" class="btn-aprobar">
        <i class="fa-solid fa-check"></i> Aprobar
      </button>
    </form>

  </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Empresas Registradas</title>

    <link rel="stylesheet" th:href="@{/css/global.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/empresas.css}">
    <link rel="stylesheet" th:href="@{/css/components/buttons.css}">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<main class="main-content">

    <section class="header">
        <div>
            <h1>Empresas registradas</h1>
            <p>Gestioná y consultá las empresas registradas dentro del Parque Industrial.</p>
        </div>
    </section>

    <section class="cards">
        <div class="card">
            <h3>Total empresas</h3>
            <h2 th:text="${totalEmpresas}">0</h2>
        </div>

        <div class="card">
            <h3>Dadas de baja</h3>
            <h2 th:text="${dadasDeBaja}">0</h2>
        </div>

        <div class="card">
            <h3>Radicadas</h3>
            <h2 th:text="${radicadas}">0</h2>
        </div>

        <div class="card">
            <h3>Pendientes de lote</h3>
            <h2 th:text="${pendienteLote}">0</h2>
        </div>
    </section>

    <section class="table-container">

        <div class="table-top">
            <h3>Lista de empresas</h3>

            <form id="searchForm"
                  th:action="@{/empresas}"
                  method="get"
                  class="search-form">

                <input id="buscador"
                       type="text"
                       name="buscar"
                       placeholder="Buscar empresa..."
                       th:value="${buscar}">

                <select id="filtroEstado" name="estado">
                    <option value="">Todos los estados</option>

                    <option th:each="estadoOption : ${estadosEmpresa}"
                            th:value="${estadoOption}"
                            th:text="${#strings.replace(estadoOption, '_', ' ')}"
                            th:selected="${estadoOption == estado}">
                    </option>
                </select>

            </form>
        </div>

        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Razón social</th>
                <th>CUIT</th>
                <th>Rubro</th>
                <th>Email</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>

            <tbody id="tablaEmpresas">
            <tr th:each="empresa : ${empresas}"
                th:data-razon-social="${#strings.toLowerCase(empresa.razonSocial)}"
                th:data-estado="${empresa.estadoEmpresa}">

                <td th:text="${empresa.id}"></td>
                <td th:text="${empresa.razonSocial}"></td>
                <td th:text="${empresa.cuit}"></td>
                <td th:text="${empresa.rubro}"></td>
                <td th:text="${empresa.email}"></td>

                <td>
                    <span class="estado"
                          th:classappend="${#strings.toLowerCase(empresa.estadoEmpresa)}"
                          th:text="${#strings.replace(empresa.estadoEmpresa, '_', ' ')}">
                    </span>
                </td>

                <td>
                    <a th:href="@{/empresas/{id}(id=${empresa.id})}"
                       class="btn btn-edit">
                        <i class="fa-solid fa-eye"></i>
                        Ver detalle
                    </a>
                </td>

            </tr>
            </tbody>
        </table>

    </section>

</main>

<script th:src="@{/js/empresas.js}"></script>

</body>
</html>
